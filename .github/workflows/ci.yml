name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      # start.mjs --check는 claude 명령도 확인하므로 runner에 Claude Code를 깐다(로그인은 하지 않는다).
      - run: npm install -g @anthropic-ai/claude-code
      - run: node start.mjs --check
